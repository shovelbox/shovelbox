<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-label="Shovelbox systems activity including private work">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071019"/>
      <stop offset="45%" stop-color="#0b1a2b"/>
      <stop offset="100%" stop-color="#08262f"/>
    </linearGradient>
    <linearGradient id="publicBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="privateBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="70%" stop-color="#34d399" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122033"/>
      <stop offset="100%" stop-color="#0d1724"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1120" height="460" rx="20"/></clipPath>
  </defs>
  <style>
    .t1 { font:700 30px ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif; fill:#f8fafc }
    .t2 { font:500 13px ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif; fill:#93a4b8 }
    .t3 { font:700 26px ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif; fill:#f8fafc }
    .t4 { font:500 11px ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif; fill:#8ea0b5 }
    .t5 { font:600 12px ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif; fill:#dbe7f3 }
    .t6 { font:600 11px ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif; fill:#9fb3c8 }
    .chip { font:600 11px ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif; fill:#e8f1f8 }
    .bar { transform-box:fill-box; transform-origin:bottom }
    .barPriv { animation:glowBar 2.8s ease-in-out infinite }
    @keyframes glowBar { 0%,100% { opacity:.82 } 50% { opacity:1 } }
    .scan { animation:scan 4.2s linear infinite }
    @keyframes scan { from { transform:translateX(-140px) } to { transform:translateX(1180px) } }
    .pulse { animation:pulse 2.2s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    .dot { animation:dot 2.8s ease-in-out infinite }
    @keyframes dot { 0%,100% { opacity:.15 } 50% { opacity:.85 } }
    .wave { stroke-dasharray:8 12; animation:dash 1.4s linear infinite }
    @keyframes dash { to { stroke-dashoffset:-80 } }
    .float { animation:float 3s ease-in-out infinite }
    @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-5px) } }
    .ring { animation:spin 10s linear infinite; transform-origin:980px 86px }
    @keyframes spin { to { transform:rotate(360deg) } }
  </style>
