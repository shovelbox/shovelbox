name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 KST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-3d.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - name: Check private contribution token
        if: ${{ secrets.PROFILE_GITHUB_TOKEN == '' }}
        run: |
          echo "::warning::PROFILE_GITHUB_TOKEN is not set."
          echo "::warning::The 3D graph will only include public contributions."
          echo "::warning::Create a classic PAT with read:user and add it as PROFILE_GITHUB_TOKEN."

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name shovelbox
          git config user.email axax1023@gmail.com
          git add -A profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "Graph already up to date."
            exit 0
          fi
          if git commit -m "Update contribution graph"; then
            git push
          fi
