name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 KST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Prefer a classic PAT with `read:user` so private contributions render.
          # Repo Settings → Secrets → Actions → PROFILE_GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name shovelbox
          git config user.email axax1023@gmail.com
          git add -A .
          if git commit -m "Update contribution graph"; then
            git push
          fi
